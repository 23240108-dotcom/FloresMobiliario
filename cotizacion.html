<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotización</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/estilos.css"><script src="js/app.js"></script></head><body><script>nav('cotizacion'); requireLogin()</script><main class="container my-5"><h1>Nueva cotización</h1><div class="row g-4"><div class="col-lg-5"><div class="card shadow p-4"><h4>Agregar producto</h4><label class="form-label">Producto</label><select id="producto" class="form-select mb-3"></select><label class="form-label">Cantidad</label><input type="number" id="cantidad" class="form-control mb-3" min="1" value="1"><button class="btn btn-primary" onclick="agregar()">Agregar detalle</button></div></div><div class="col-lg-7"><div class="card shadow p-4"><h4>Detalle de cotización</h4><table class="table"><thead><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th><th></th></tr></thead><tbody id="tb"></tbody></table><h3 class="text-end">Total: <span id="total">$0</span></h3><button class="btn btn-success" onclick="guardar()">Guardar cotización</button><div id="msg" class="mt-3"></div></div></div></div></main><script>
let detalles=[]; const ps=get(DB.productos); ps.forEach(p=>producto.innerHTML+=`<option value="${p.id}">${p.nombre} - ${money(p.precio)} - Stock ${p.stock}</option>`); const pre=new URLSearchParams(location.search).get('producto'); if(pre) producto.value=pre;
function pintar(){tb.innerHTML=''; let t=0; detalles.forEach((d,i)=>{t+=d.subtotal; tb.innerHTML+=`<tr><td>${d.nombre}</td><td>${d.cantidad}</td><td>${money(d.precio_unitario)}</td><td>${money(d.subtotal)}</td><td><button class="btn btn-sm btn-danger" onclick="detalles.splice(${i},1);pintar()">X</button></td></tr>`}); total.textContent=money(t)}
function agregar(){const p=ps.find(x=>x.id==producto.value), cant=Number(cantidad.value); if(!p||cant<1)return; if(cant>p.stock){alert('La cantidad supera el stock disponible.');return} detalles.push({id_producto:p.id,nombre:p.nombre,cantidad:cant,precio_unitario:Number(p.precio),subtotal:cant*Number(p.precio)}); pintar()}
function guardar(){const s=sesion(); if(!detalles.length){msg.innerHTML='<div class="alert alert-warning">Agrega al menos un producto.</div>';return} const cot=get(DB.cotizaciones), det=get(DB.detalles), productos=get(DB.productos); const id=nextId(DB.cotizaciones), totalNum=detalles.reduce((a,b)=>a+b.subtotal,0); cot.push({id,folio:'COT-'+String(1000+id),fecha:today(),total:totalNum,id_cliente:s.tipo==='cliente'?s.id:null,id_administrador:s.tipo==='admin'?s.id:1}); detalles.forEach(d=>det.push({id:nextId(DB.detalles)+det.length,id_cotizacion:id,id_producto:d.id_producto,cantidad:d.cantidad,precio_unitario:d.precio_unitario,subtotal:d.subtotal})); detalles.forEach(d=>{const p=productos.find(x=>x.id==d.id_producto); if(p)p.stock=Math.max(0,p.stock-d.cantidad)}); set(DB.cotizaciones,cot);set(DB.detalles,det);set(DB.productos,productos); msg.innerHTML='<div class="alert alert-success">Cotización guardada correctamente.</div>'; detalles=[]; pintar(); setTimeout(()=>location.href='perfil.html',800)}
</script><script>footer()</script></body></html>
