<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotización | Flores Mobiliario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .navbar{
            background:#0d6efd;
        }

        .navbar-brand{
            color:white !important;
            font-weight:bold;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        .titulo{
            color:#0d6efd;
            font-weight:bold;
        }

        .resumen{
            background:#eef5ff;
            border-radius:10px;
            padding:15px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand" href="#">
            Flores Mobiliario
        </a>

        <div class="ms-auto">

            <a href="perfil.html" class="btn btn-light me-2">
                Mi Perfil
            </a>

            <button class="btn btn-danger" onclick="cerrarSesion()">
                Cerrar Sesión
            </button>

        </div>

    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card p-4">

                <h2 class="titulo text-center mb-4">
                    Nueva Cotización
                </h2>

                <form id="formCotizacion">

                    <div class="mb-3">
                        <label class="form-label">
                            Cliente
                        </label>

                        <input
                            type="text"
                            id="cliente"
                            class="form-control"
                            readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Empresa
                        </label>

                        <input
                            type="text"
                            id="empresa"
                            class="form-control"
                            readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Producto
                        </label>

                        <select
                            id="producto"
                            class="form-select"
                            required>

                            <option value="">
                                Seleccione un producto
                            </option>

                            <option value="Escritorio Ejecutivo" data-precio="8500">
                                Escritorio Ejecutivo - $8,500
                            </option>

                            <option value="Silla Ergonómica" data-precio="3500">
                                Silla Ergonómica - $3,500
                            </option>

                            <option value="Mesa de Juntas" data-precio="12000">
                                Mesa de Juntas - $12,000
                            </option>

                            <option value="Archivero Metálico" data-precio="2800">
                                Archivero Metálico - $2,800
                            </option>

                            <option value="Recepción Modular" data-precio="18500">
                                Recepción Modular - $18,500
                            </option>

                        </select>
                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Precio Unitario
                        </label>

                        <input
                            type="number"
                            id="precio"
                            class="form-control"
                            readonly>
                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Cantidad
                        </label>

                        <input
                            type="number"
                            id="cantidad"
                            class="form-control"
                            min="1"
                            value="1"
                            required>
                    </div>

                    <div class="resumen mb-3">

                        <h5>Total Cotización</h5>

                        <h3 id="totalTexto">
                            $0.00
                        </h3>

                    </div>

                    <div id="mensaje"></div>

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg">

                            Guardar Cotización

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<script>

const usuario = JSON.parse(
    localStorage.getItem("usuarioLogueado")
);

if(!usuario){
    window.location.href = "login.html";
}

document.getElementById("cliente").value =
    usuario.nombre + " " + usuario.apellidos;

document.getElementById("empresa").value =
    usuario.empresa;

const producto =
    document.getElementById("producto");

const precio =
    document.getElementById("precio");

const cantidad =
    document.getElementById("cantidad");

const totalTexto =
    document.getElementById("totalTexto");

const mensaje =
    document.getElementById("mensaje");

function calcularTotal(){

    const opcion =
        producto.options[producto.selectedIndex];

    const precioUnitario =
        Number(opcion.dataset.precio || 0);

    precio.value =
        precioUnitario;

    const total =
        precioUnitario * Number(cantidad.value);

    totalTexto.textContent =
        "$" + total.toLocaleString(
            "es-MX",
            {
                minimumFractionDigits: 2
            }
        );

    return total;
}

producto.addEventListener(
    "change",
    calcularTotal
);

cantidad.addEventListener(
    "input",
    calcularTotal
);

function generarFolio(){

    let cotizaciones =
        JSON.parse(
            localStorage.getItem("cotizaciones")
        ) || [];

    let consecutivo =
        cotizaciones.length + 1001;

    return "COT-" + consecutivo;
}

document.getElementById(
    "formCotizacion"
).addEventListener(
    "submit",
    function(e){

        e.preventDefault();

        const nombreProducto =
            producto.value;

        const precioUnitario =
            Number(precio.value);

        const cantidadProducto =
            Number(cantidad.value);

        const total =
            calcularTotal();

        const nuevaCotizacion = {

            id: Date.now(),

            folio: generarFolio(),

            fecha: new Date().toLocaleString(),

            producto: nombreProducto,

            precio: precioUnitario,

            cantidad: cantidadProducto,

            total: total,

            usuarioId: usuario.id,

            nombreUsuario:
                usuario.nombre +
                " " +
                usuario.apellidos,

            correoUsuario:
                usuario.correo,

            empresa:
                usuario.empresa

        };

        let cotizaciones =
            JSON.parse(
                localStorage.getItem("cotizaciones")
            ) || [];

        cotizaciones.push(
            nuevaCotizacion
        );

        localStorage.setItem(
            "cotizaciones",
            JSON.stringify(cotizaciones)
        );

        mensaje.innerHTML = `
            <div class="alert alert-success mt-3">
                Cotización guardada correctamente.<br>
                Folio generado:
                <strong>${nuevaCotizacion.folio}</strong>
            </div>
        `;

        document.getElementById(
            "formCotizacion"
        ).reset();

        precio.value = "";
        totalTexto.textContent = "$0.00";

    }
);

function cerrarSesion(){

    localStorage.removeItem(
        "usuarioLogueado"
    );

    window.location.href =
        "login.html";

}

</script>

</body>
</html>
