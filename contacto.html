<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacto</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/estilos.css"><script src="js/app.js"></script></head><body><script>nav('contacto')</script><main class="container my-5" style="max-width:820px"><div class="card shadow p-4"><h1>Contacto</h1><form id="f" class="row g-3"><div class="col-md-6"><label class="form-label">Nombre</label><input id="n" class="form-control" required></div><div class="col-md-6"><label class="form-label">Correo</label><input type="email" id="e" class="form-control" required></div><div class="col-12"><label class="form-label">Asunto</label><select id="a" class="form-select"><option>Información de productos</option><option>Cotización</option><option>Soporte</option></select></div><div class="col-12"><label class="form-label">Mensaje</label><textarea id="m" class="form-control" rows="5" required></textarea></div><div id="msg"></div><div><button class="btn btn-primary">Enviar</button></div></form></div></main><script>f.onsubmit=e=>{e.preventDefault();let mensajes=get('fm_mensajes_contacto');mensajes.push({id:mensajes.length+1,nombre:n.value,correo:e.value,asunto:a.value,mensaje:m.value,fecha:new Date().toLocaleString()});set('fm_mensajes_contacto',mensajes);msg.innerHTML='<div class="alert alert-success">Mensaje guardado en LocalStorage.</div>';f.reset()}</script><script>footer()</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
