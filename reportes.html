<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reportes</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/estilos.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="js/app.js"></script></head><body><script>nav('reportes'); requireAdmin()</script><main class="container my-5"><h1>Reportes</h1><div class="row g-3 mb-4"><div class="col-md-3"><div class="card shadow p-3"><b>Usuarios</b><div class="numero" id="u"></div></div></div><div class="col-md-3"><div class="card shadow p-3"><b>Cotizaciones</b><div class="numero" id="c"></div></div></div><div class="col-md-3"><div class="card shadow p-3"><b>Productos</b><div class="numero" id="p"></div></div></div><div class="col-md-3"><div class="card shadow p-3"><b>Importe</b><div class="numero" id="t"></div></div></div></div><div class="card shadow p-4"><h3>Productos cotizados</h3><canvas id="graf" height="90"></canvas></div></main><script>const det=get(DB.detalles), prod=get(DB.productos);u.textContent=get(DB.clientes).length;c.textContent=get(DB.cotizaciones).length;p.textContent=prod.length;t.textContent=money(get(DB.cotizaciones).reduce((a,b)=>a+Number(b.total),0));const labels=prod.map(x=>x.nombre), data=prod.map(x=>det.filter(d=>d.id_producto===x.id).reduce((a,b)=>a+b.cantidad,0));new Chart(graf,{type:'bar',data:{labels,datasets:[{label:'Cantidad cotizada',data}]}});</script><script>footer()</script></body></html>
