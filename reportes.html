<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes | Flores Mobiliario</title>

    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body{
            background:#f4f6f9;
        }

        .navbar{
            background:#0d6efd;
        }

        .navbar-brand{
            color:white !important;
            font-weight:bold;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 12px rgba(0,0,0,.1);
        }

        .kpi{
            text-align:center;
            padding:20px;
        }

        .numero{
            font-size:2rem;
            font-weight:bold;
            color:#0d6efd;
        }

        .titulo{
            color:#0d6efd;
            font-weight:bold;
        }

        .table thead{
            background:#0d6efd;
            color:white;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container">

<a class="navbar-brand fw-bold"
href="index.html">

🏢 Flores Mobiliario

</a>

<button class="navbar-toggler"
data-bs-toggle="collapse"
data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse"
id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link"
href="index.html">
Inicio
</a>
</li>

<li class="nav-item">
<a class="nav-link"
href="productos.html">
Productos
</a>
</li>

<li class="nav-item">
<a class="nav-link"
href="perfil.html">
Perfil
</a>
</li>

<li class="nav-item">
<a class="nav-link"
href="admin.html">
Administración
</a>
</li>

<li class="nav-item">
<a class="nav-link active"
href="reportes.html">
Reportes
</a>
</li>

<li class="nav-item">
<a class="nav-link text-danger"
href="#"
onclick="cerrarSesion()">
Cerrar Sesión
</a>
</li>

</ul>

</div>

</div>

</nav>

<div class="container mt-4">

    <div class="row">

        <div class="col-md-3 mb-4">
            <div class="card kpi">
                <h6>Usuarios</h6>
                <div class="numero" id="usuariosKPI">0</div>
            </div>
        </div>

        <div class="col-md-3 mb-4">
            <div class="card kpi">
                <h6>Cotizaciones</h6>
                <div class="numero" id="cotizacionesKPI">0</div>
            </div>
        </div>

        <div class="col-md-3 mb-4">
            <div class="card kpi">
                <h6>Productos</h6>
                <div class="numero" id="productosKPI">0</div>
            </div>
        </div>

        <div class="col-md-3 mb-4">
            <div class="card kpi">
                <h6>Total Cotizado</h6>
                <div class="numero" id="ventasKPI">$0</div>
                <div class="col-md-3 mb-4">

                <div class="card kpi">

                <h6>Producto Líder</h6>

                <div
                class="numero"
                style="font-size:1rem;"
                id="productoLider">

                N/A

                </div>

                </div>

                </div>
            </div>
        </div>

    </div>

    <div class="row">

        <div class="col-lg-6 mb-4">

            <div class="card p-4">

                <h4 class="titulo mb-3">
                    Productos Más Cotizados
                </h4>

                <canvas id="graficaProductos"></canvas>

            </div>

        </div>

        <div class="col-lg-6 mb-4">

            <div class="card p-4">

                <h4 class="titulo mb-3">
                    Distribución de Cotizaciones
                </h4>

                <canvas id="graficaPie"></canvas>

            </div>

        </div>

    </div>

    <div class="card p-4">

        <h4 class="titulo mb-3">
            Ranking de Productos
        </h4>

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cotizaciones</th>
                        <th>Cantidad Total</th>
                    </tr>
                </thead>

                <tbody id="tablaProductos">
                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

const usuarioLogueado =
    JSON.parse(
        localStorage.getItem(
            "usuarioLogueado"
        )
    );

if(!usuarioLogueado){

    window.location.href =
        "login.html";
}

if(usuarioLogueado.rol !== "admin"){

    window.location.href =
        "perfil.html";
}

const usuarios =
    JSON.parse(
        localStorage.getItem("usuarios")
    ) || [];

const cotizaciones =
    JSON.parse(
        localStorage.getItem("cotizaciones")
    ) || [];

document.getElementById(
    "usuariosKPI"
).textContent =
    usuarios.length;

document.getElementById(
    "cotizacionesKPI"
).textContent =
    cotizaciones.length;

let totalVentas = 0;

const productos = {};

cotizaciones.forEach(c => {

    totalVentas += Number(c.total);

    if(!productos[c.producto]){

        productos[c.producto] = {

            veces: 0,
            cantidad: 0

        };
    }

    productos[c.producto].veces++;

    productos[c.producto].cantidad +=
        Number(c.cantidad);

});

document.getElementById(
    "ventasKPI"
).textContent =
    "$" +
    totalVentas.toLocaleString(
        "es-MX"
    );

document.getElementById(
    "productosKPI"
).textContent =
    Object.keys(productos).length;

const nombresProductos =
    Object.keys(productos);
    let lider = "N/A";
let maximo = 0;

for(let producto in productos){

if(productos[producto].veces > maximo){

maximo =
productos[producto].veces;

lider =
producto;

}

}

document.getElementById(
"productoLider"
).textContent =
lider;

const totalCotizaciones =
    nombresProductos.map(
        producto =>
        productos[producto].veces
    );

const tabla =
    document.getElementById(
        "tablaProductos"
    );

if(nombresProductos.length === 0){

    tabla.innerHTML = `
        <tr>
            <td colspan="3" class="text-center">
                No existen datos para mostrar.
            </td>
        </tr>
    `;

}else{

    nombresProductos.forEach(producto => {

        tabla.innerHTML += `
            <tr>

                <td>${producto}</td>

                <td>
                    ${productos[producto].veces}
                </td>

                <td>
                    ${productos[producto].cantidad}
                </td>

            </tr>
        `;

    });

}

if(nombresProductos.length > 0){

new Chart(
document.getElementById("graficaProductos"),
{
type:"bar",
data:{
labels:nombresProductos,
datasets:[{
label:"Cotizaciones",
data:totalCotizaciones,
backgroundColor:"#0d6efd"
}]
},
options:{
responsive:true,
plugins:{
legend:{
display:false
}
}
}
}
);

}

new Chart(

    document.getElementById(
        "graficaPie"
    ),

    {

        type: "pie",

        data: {

            labels:
                nombresProductos,

            datasets: [

                {

                    data:
                        totalCotizaciones,

                    backgroundColor: [

                        "#0d6efd",
                        "#198754",
                        "#ffc107",
                        "#dc3545",
                        "#6f42c1",
                        "#20c997",
                        "#fd7e14"

                    ]

                }

            ]

        }

    }

);

function cerrarSesion(){

    localStorage.removeItem(
        "usuarioLogueado"
    );

    window.location.href =
        "login.html";
}

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
