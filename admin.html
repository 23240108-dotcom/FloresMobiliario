<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo | Flores Mobiliario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .navbar {
            background-color: #0d6efd;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0px 4px 12px rgba(0,0,0,.1);
        }

        .card-resumen {
            text-align: center;
            padding: 20px;
        }

        .numero {
            font-size: 2rem;
            font-weight: bold;
            color: #0d6efd;
        }

        .table thead {
            background-color: #0d6efd;
            color: white;
        }

        .titulo {
            color: #0d6efd;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand" href="#">
            Flores Mobiliario - Administración
        </a>

        <div class="ms-auto">

            <a href="reportes.html" class="btn btn-light me-2">
                Reportes
            </a>

            <button class="btn btn-danger" onclick="cerrarSesion()">
                Cerrar Sesión
            </button>

        </div>

    </div>
</nav>

<div class="container mt-4">

    <div class="row">

        <div class="col-md-4 mb-4">

            <div class="card card-resumen">
                <h5>Total Usuarios</h5>
                <div class="numero" id="totalUsuarios">0</div>
            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card card-resumen">
                <h5>Total Cotizaciones</h5>
                <div class="numero" id="totalCotizaciones">0</div>
            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card card-resumen">
                <h5>Ventas Cotizadas</h5>
                <div class="numero" id="montoTotal">$0</div>
            </div>

        </div>

    </div>

    <div class="card p-4 mb-4">

        <h3 class="titulo mb-3">
            Usuarios Registrados
        </h3>

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Empresa</th>
                        <th>Rol</th>
                        <th>Fecha Registro</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="tablaUsuarios">
                </tbody>

            </table>

        </div>

    </div>

    <div class="card p-4">

        <h3 class="titulo mb-3">
            Cotizaciones Registradas
        </h3>

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead>
                    <tr>
                        <th>Folio</th>
                        <th>Cliente</th>
                        <th>Empresa</th>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Total</th>
                        <th>Fecha</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="tablaCotizaciones">
                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

const usuarioLogueado = JSON.parse(
    localStorage.getItem("usuarioLogueado")
);

if (!usuarioLogueado) {
    window.location.href = "login.html";
}

if (usuarioLogueado.rol !== "admin") {
    window.location.href = "perfil.html";
}

function obtenerUsuarios() {
    return JSON.parse(localStorage.getItem("usuarios")) || [];
}

function obtenerCotizaciones() {
    return JSON.parse(localStorage.getItem("cotizaciones")) || [];
}

function cargarResumen() {

    const usuarios = obtenerUsuarios();
    const cotizaciones = obtenerCotizaciones();

    let totalVentas = 0;

    cotizaciones.forEach(c => {
        totalVentas += Number(c.total);
    });

    document.getElementById("totalUsuarios").textContent =
        usuarios.length;

    document.getElementById("totalCotizaciones").textContent =
        cotizaciones.length;

    document.getElementById("montoTotal").textContent =
        "$" + totalVentas.toLocaleString("es-MX");
}

function cargarUsuarios() {

    const usuarios = obtenerUsuarios();

    const tabla =
        document.getElementById("tablaUsuarios");

    tabla.innerHTML = "";

    usuarios.forEach(usuario => {

        tabla.innerHTML += `
            <tr>
                <td>
                    ${usuario.nombre}
                    ${usuario.apellidos}
                </td>

                <td>${usuario.correo}</td>

                <td>${usuario.empresa}</td>

                <td>${usuario.rol}</td>

                <td>${usuario.fechaRegistro}</td>

                <td>

                    ${
                        usuario.rol === "admin"
                        ?
                        '<span class="badge bg-primary">Administrador</span>'
                        :
                        `<button
                            class="btn btn-danger btn-sm"
                            onclick="eliminarUsuario(${usuario.id})">
                            Eliminar
                        </button>`
                    }

                </td>
            </tr>
        `;
    });

}

function cargarCotizaciones() {

    const cotizaciones =
        obtenerCotizaciones();

    const tabla =
        document.getElementById(
            "tablaCotizaciones"
        );

    tabla.innerHTML = "";

    cotizaciones.forEach(c => {

        tabla.innerHTML += `
            <tr>

                <td>${c.folio}</td>

                <td>${c.nombreUsuario}</td>

                <td>${c.empresa}</td>

                <td>${c.producto}</td>

                <td>${c.cantidad}</td>

                <td>
                    $${Number(c.total)
                        .toLocaleString("es-MX")}
                </td>

                <td>${c.fecha}</td>

                <td>

                    <button
                        class="btn btn-danger btn-sm"
                        onclick="eliminarCotizacion(${c.id})">

                        Eliminar

                    </button>

                </td>

            </tr>
        `;
    });

}

function eliminarUsuario(id) {

    const confirmar =
        confirm(
            "¿Deseas eliminar este usuario?"
        );

    if(!confirmar) return;

    let usuarios =
        obtenerUsuarios();

    usuarios =
        usuarios.filter(
            usuario => usuario.id !== id
        );

    localStorage.setItem(
        "usuarios",
        JSON.stringify(usuarios)
    );

    let cotizaciones =
        obtenerCotizaciones();

    cotizaciones =
        cotizaciones.filter(
            cotizacion =>
            cotizacion.usuarioId !== id
        );

    localStorage.setItem(
        "cotizaciones",
        JSON.stringify(cotizaciones)
    );

    cargarResumen();
    cargarUsuarios();
    cargarCotizaciones();
}

function eliminarCotizacion(id) {

    const confirmar =
        confirm(
            "¿Eliminar esta cotización?"
        );

    if(!confirmar) return;

    let cotizaciones =
        obtenerCotizaciones();

    cotizaciones =
        cotizaciones.filter(
            cotizacion =>
            cotizacion.id !== id
        );

    localStorage.setItem(
        "cotizaciones",
        JSON.stringify(cotizaciones)
    );

    cargarResumen();
    cargarCotizaciones();
}

function cerrarSesion() {

    localStorage.removeItem(
        "usuarioLogueado"
    );

    window.location.href =
        "login.html";
}

cargarResumen();
cargarUsuarios();
cargarCotizaciones();

</script>

</body>
</html>
