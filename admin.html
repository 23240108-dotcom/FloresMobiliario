<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/estilos.css"><script src="js/app.js"></script></head><body><script>nav('admin'); requireAdmin()</script><main class="container my-5"><h1>Panel de administración</h1><div class="row g-3 mb-4"><div class="col-md-3"><div class="card shadow p-3 text-center"><b>Clientes</b><div id="kcli" class="numero"></div></div></div><div class="col-md-3"><div class="card shadow p-3 text-center"><b>Productos</b><div id="kpro" class="numero"></div></div></div><div class="col-md-3"><div class="card shadow p-3 text-center"><b>Cotizaciones</b><div id="kcot" class="numero"></div></div></div><div class="col-md-3"><div class="card shadow p-3 text-center"><b>Total</b><div id="ktot" class="numero"></div></div></div></div>
<ul class="nav nav-tabs" role="tablist"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#prod">Productos</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#catg">Categorías</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#prov">Proveedores</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#cli">Clientes</button></li></ul>
<div class="tab-content card shadow p-4 rounded-0 rounded-bottom"><div id="prod" class="tab-pane fade show active"><h3>Productos</h3><form id="fp" class="row g-2 mb-3"><input type="hidden" id="pid"><div class="col-md-3"><input id="pn" class="form-control" placeholder="Nombre" required></div><div class="col-md-2"><input id="pc" class="form-control" placeholder="Color"></div><div class="col-md-2"><input id="pm" class="form-control" placeholder="Medida"></div><div class="col-md-2"><input type="number" id="pp" class="form-control" placeholder="Precio" required></div><div class="col-md-1"><input type="number" id="ps" class="form-control" placeholder="Stock" required></div><div class="col-md-2"><select id="pca" class="form-select"></select></div><div><button class="btn btn-primary">Guardar producto</button></div></form><table class="table"><thead><tr><th>ID</th><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th></th></tr></thead><tbody id="tbp"></tbody></table></div>
<div id="catg" class="tab-pane fade"><h3>Categorías</h3><form id="fc" class="d-flex gap-2 mb-3"><input id="cn" class="form-control" placeholder="Nombre de categoría" required><button class="btn btn-primary">Agregar</button></form><table class="table"><tbody id="tbc"></tbody></table></div>
<div id="prov" class="tab-pane fade"><h3>Proveedores</h3><form id="fv" class="row g-2 mb-3"><div class="col-md-4"><input id="vn" class="form-control" placeholder="Nombre" required></div><div class="col-md-2"><input id="vt" class="form-control" placeholder="Teléfono"></div><div class="col-md-3"><input id="ve" class="form-control" placeholder="Correo"></div><div class="col-md-3"><input id="vc" class="form-control" placeholder="Ciudad"></div><div><button class="btn btn-primary">Agregar proveedor</button></div></form><table class="table"><tbody id="tbv"></tbody></table></div>
<div id="cli" class="tab-pane fade"><h3>Clientes</h3><table class="table"><thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Teléfono</th></tr></thead><tbody id="tbcli"></tbody></table></div></div></main>
<script>
function stats(){kcli.textContent=get(DB.clientes).length;kpro.textContent=get(DB.productos).length;kcot.textContent=get(DB.cotizaciones).length;ktot.textContent=money(get(DB.cotizaciones).reduce((a,b)=>a+Number(b.total),0))}
function renderAdmin(){stats(); const cm=catsMap(); pca.innerHTML=get(DB.categorias).map(c=>`<option value="${c.id}">${c.nombre}</option>`).join(''); tbp.innerHTML='';get(DB.productos).forEach(p=>tbp.innerHTML+=`<tr><td>${p.id}</td><td>${p.nombre}<br><small>${p.color} · ${p.medida}</small></td><td>${cm[p.id_categoria]||''}</td><td>${money(p.precio)}</td><td>${p.stock}</td><td><button class="btn btn-sm btn-outline-primary" onclick="editP(${p.id})">Editar</button> <button class="btn btn-sm btn-outline-danger" onclick="del('${DB.productos}',${p.id})">Eliminar</button></td></tr>`); tbc.innerHTML='';get(DB.categorias).forEach(c=>tbc.innerHTML+=`<tr><td>${c.id}</td><td>${c.nombre}</td><td><button class="btn btn-sm btn-outline-danger" onclick="del('${DB.categorias}',${c.id})">Eliminar</button></td></tr>`); tbv.innerHTML='';get(DB.proveedores).forEach(v=>tbv.innerHTML+=`<tr><td>${v.id}</td><td>${v.nombre}</td><td>${v.telefono}</td><td>${v.correo}</td><td>${v.ciudad}</td></tr>`); tbcli.innerHTML='';get(DB.clientes).forEach(c=>tbcli.innerHTML+=`<tr><td>${c.id}</td><td>${c.nombre}</td><td>${c.correo}</td><td>${c.telefono||''}</td></tr>`)}
fp.onsubmit=e=>{e.preventDefault();let a=get(DB.productos), id=pid.value?Number(pid.value):nextId(DB.productos), o={id,nombre:pn.value,color:pc.value,medida:pm.value,precio:Number(pp.value),stock:Number(ps.value),id_categoria:Number(pca.value),imagen:img[id]||'logo.png'}; a=a.filter(x=>x.id!==id);a.push(o);set(DB.productos,a);fp.reset();pid.value='';renderAdmin()}; function editP(id){const p=get(DB.productos).find(x=>x.id===id); pid.value=p.id;pn.value=p.nombre;pc.value=p.color;pm.value=p.medida;pp.value=p.precio;ps.value=p.stock;pca.value=p.id_categoria}
fc.onsubmit=e=>{e.preventDefault();const a=get(DB.categorias);a.push({id:nextId(DB.categorias),nombre:cn.value});set(DB.categorias,a);fc.reset();renderAdmin()}; fv.onsubmit=e=>{e.preventDefault();const a=get(DB.proveedores);a.push({id:nextId(DB.proveedores),nombre:vn.value,telefono:vt.value,correo:ve.value,direccion:'',ciudad:vc.value,pais:'México',estado:'Guanajuato'});set(DB.proveedores,a);fv.reset();renderAdmin()}; function del(k,id){if(confirm('¿Eliminar registro?')){set(k,get(k).filter(x=>x.id!==id));renderAdmin()}} renderAdmin();
</script><script>footer()</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
