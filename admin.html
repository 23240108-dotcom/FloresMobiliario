<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Flores Mobiliario</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f4f6f9}
.navbar{background:#0a2647}
.card{border:none;border-radius:15px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.numero{font-size:2rem;font-weight:bold;color:#0d6efd}
.titulo{color:#0d6efd;font-weight:bold}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">
<a class="navbar-brand fw-bold" href="index.html">🏢 Flores Mobiliario</a>
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="reportes.html">Reportes</a></li>
<li class="nav-item"><a class="nav-link text-danger" href="#" onclick="cerrarSesion()">Cerrar Sesión</a></li>
</ul>
</div>
</nav>

<div class="container mt-4">
<div class="row">
<div class="col-md-4"><div class="card p-3 text-center"><h5>Usuarios</h5><div id="totalUsuarios" class="numero">0</div></div></div>
<div class="col-md-4"><div class="card p-3 text-center"><h5>Cotizaciones</h5><div id="totalCotizaciones" class="numero">0</div></div></div>
<div class="col-md-4"><div class="card p-3 text-center"><h5>Total</h5><div id="montoTotal" class="numero">$0</div></div></div>
</div>

<div class="card p-4 mt-4">
<h3 class="titulo">Usuarios</h3>
<table class="table">
<thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th></tr></thead>
<tbody id="tablaUsuarios"></tbody>
</table>
</div>

<div class="card p-4 mt-4">
<h3 class="titulo">Cotizaciones</h3>
<table class="table">
<thead><tr><th>Folio</th><th>Cliente</th><th>Producto</th><th>Total</th></tr></thead>
<tbody id="tablaCotizaciones"></tbody>
</table>
</div>

<div class="card p-4 mt-4">
<h3 class="titulo">Productos</h3>
<button class="btn btn-success mb-3" onclick="agregarProducto()">Nuevo Producto</button>
<table class="table">
<thead><tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Descripción</th><th>Acciones</th></tr></thead>
<tbody id="tablaProductos"></tbody>
</table>
</div>
</div>

<script>
const usuarioLogueado=JSON.parse(localStorage.getItem("usuarioLogueado"));
if(!usuarioLogueado||usuarioLogueado.rol!=="admin"){window.location.href="login.html";}

function obtenerUsuarios(){return JSON.parse(localStorage.getItem("usuarios"))||[];}
function obtenerCotizaciones(){return JSON.parse(localStorage.getItem("cotizaciones"))||[];}
function obtenerProductos(){return JSON.parse(localStorage.getItem("productos"))||[];}

function inicializarProductos(){
if(!localStorage.getItem("productos")){
localStorage.setItem("productos",JSON.stringify([
{id:1,nombre:"Escritorio Ejecutivo",precio:5500,descripcion:"Ideal para oficinas corporativas"},
{id:2,nombre:"Silla Ergonómica",precio:2800,descripcion:"Máxima comodidad"},
{id:3,nombre:"Archivero Metálico",precio:3200,descripcion:"Organización profesional"}
]));
}
}

function cargarResumen(){
const u=obtenerUsuarios(), c=obtenerCotizaciones();
document.getElementById("totalUsuarios").textContent=u.length;
document.getElementById("totalCotizaciones").textContent=c.length;
document.getElementById("montoTotal").textContent="$"+c.reduce((a,b)=>a+Number(b.total||0),0).toLocaleString("es-MX");
}

function cargarUsuarios(){
const tabla=document.getElementById("tablaUsuarios");
tabla.innerHTML="";
obtenerUsuarios().forEach(u=>{
tabla.innerHTML+=`<tr><td>${u.nombre||""} ${u.apellidos||""}</td><td>${u.correo||""}</td><td>${u.rol||""}</td></tr>`;
});
}

function cargarCotizaciones(){
const tabla=document.getElementById("tablaCotizaciones");
tabla.innerHTML="";
obtenerCotizaciones().forEach(c=>{
tabla.innerHTML+=`<tr><td>${c.folio||""}</td><td>${c.nombreUsuario||""}</td><td>${c.producto||""}</td><td>$${Number(c.total||0).toLocaleString("es-MX")}</td></tr>`;
});
}

function cargarProductos(){
const tabla=document.getElementById("tablaProductos");
tabla.innerHTML="";
obtenerProductos().forEach(p=>{
tabla.innerHTML+=`<tr>
<td>${p.id}</td><td>${p.nombre}</td><td>$${p.precio}</td><td>${p.descripcion}</td>
<td>
<button class="btn btn-warning btn-sm" onclick="editarProducto(${p.id})">Editar</button>
<button class="btn btn-danger btn-sm" onclick="eliminarProducto(${p.id})">Eliminar</button>
</td></tr>`;
});
}

function agregarProducto(){
const nombre=prompt("Nombre del producto");
if(!nombre) return;
const precio=prompt("Precio");
const descripcion=prompt("Descripción");
let p=obtenerProductos();
p.push({id:Date.now(),nombre,precio:Number(precio),descripcion});
localStorage.setItem("productos",JSON.stringify(p));
cargarProductos();
}

function editarProducto(id){
let p=obtenerProductos();
let prod=p.find(x=>x.id===id);
if(!prod) return;
prod.nombre=prompt("Nombre",prod.nombre)||prod.nombre;
prod.precio=Number(prompt("Precio",prod.precio)||prod.precio);
prod.descripcion=prompt("Descripción",prod.descripcion)||prod.descripcion;
localStorage.setItem("productos",JSON.stringify(p));
cargarProductos();
}

function eliminarProducto(id){
let p=obtenerProductos().filter(x=>x.id!==id);
localStorage.setItem("productos",JSON.stringify(p));
cargarProductos();
}

function cerrarSesion(){
localStorage.removeItem("usuarioLogueado");
location.href="index.html";
}

inicializarProductos();
cargarResumen();
cargarUsuarios();
cargarCotizaciones();
cargarProductos();
</script>
</body>
</html>
