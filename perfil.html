<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/estilos.css"><script src="js/app.js"></script></head><body><script>nav(); requireLogin()</script><main class="container my-5"><h1>Mi perfil</h1><div class="row g-4"><div class="col-md-4"><div class="card shadow p-4"><h4 id="nom"></h4><p id="mail"></p><p><b>Tipo:</b> <span id="tipo"></span></p></div></div><div class="col-md-8"><div class="card shadow p-4"><h4>Mis cotizaciones</h4><table class="table"><thead><tr><th>Folio</th><th>Fecha</th><th>Total</th><th>Detalle</th></tr></thead><tbody id="tb"></tbody></table></div></div></div></main><script>const s=sesion(); nom.textContent=s.nombre; mail.textContent=s.correo; tipo.textContent=s.tipo; const ds=get(DB.detalles), ps=get(DB.productos); get(DB.cotizaciones).filter(c=>s.tipo==='admin'||c.id_cliente===s.id).forEach(c=>{const det=ds.filter(d=>d.id_cotizacion===c.id).map(d=>`${ps.find(p=>p.id===d.id_producto)?.nombre||'Producto'} x${d.cantidad}`).join('<br>'); tb.innerHTML+=`<tr><td>${c.folio}</td><td>${c.fecha}</td><td>${money(c.total)}</td><td>${det}</td></tr>`}); if(!tb.innerHTML) tb.innerHTML='<tr><td colspan="4" class="text-center text-muted">Sin cotizaciones</td></tr>';</script><script>footer()</script></body></html>
