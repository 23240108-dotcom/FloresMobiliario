<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Flores Mobiliario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f4f6f9;
        }

        .navbar{
            background:#0d6efd;
        }

        .navbar-brand{
            color:white !important;
            font-weight:bold;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,.1);
        }

        .titulo{
            color:#0d6efd;
            font-weight:bold;
        }

        .table thead{
            background:#0d6efd;
            color:white;
        }

        footer{
            margin-top:40px;
            padding:20px;
            text-align:center;
            color:#6c757d;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand" href="#">
            Flores Mobiliario
        </a>

        <div class="ms-auto">

            <a href="cotizacion.html" class="btn btn-light me-2">
                Nueva Cotización
            </a>

            <button class="btn btn-danger" onclick="cerrarSesion()">
                Cerrar Sesión
            </button>

        </div>

    </div>
</nav>

<div class="container mt-5">

    <div class="row">

        <div class="col-lg-4 mb-4">

            <div class="card p-4">

                <h3 class="titulo mb-4">
                    Mi Perfil
                </h3>

                <p>
                    <strong>Nombre:</strong><br>
                    <span id="nombre"></span>
                </p>

                <p>
                    <strong>Correo:</strong><br>
                    <span id="correo"></span>
                </p>

                <p>
                    <strong>Empresa:</strong><br>
                    <span id="empresa"></span>
                </p>

                <p>
                    <strong>Teléfono:</strong><br>
                    <span id="telefono"></span>
                </p>

                <p>
                    <strong>Rol:</strong><br>
                    <span id="rol"></span>
                </p>

                <p>
                    <strong>Fecha de Inicio de Sesión:</strong><br>
                    <span id="fechaInicio"></span>
                </p>

            </div>

        </div>

        <div class="col-lg-8">

            <div class="card p-4">

                <h3 class="titulo mb-4">
                    Historial de Cotizaciones
                </h3>

                <div class="table-responsive">

                    <table class="table table-bordered table-hover">

                        <thead>
                            <tr>
                                <th>Folio</th>
                                <th>Fecha</th>
                                <th>Producto</th>
                                <th>Cantidad</th>
                                <th>Total</th>
                            </tr>
                        </thead>

                        <tbody id="tablaCotizaciones">
                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<footer>
    © 2026 Flores Mobiliario - Plataforma de Venta y Cotización
</footer>

<script>

const usuario = JSON.parse(
    localStorage.getItem("usuarioLogueado")
);

if(!usuario){

    window.location.href = "login.html";
}

document.getElementById("nombre").textContent =
    usuario.nombre + " " + usuario.apellidos;

document.getElementById("correo").textContent =
    usuario.correo;

document.getElementById("empresa").textContent =
    usuario.empresa;

document.getElementById("telefono").textContent =
    usuario.telefono;

document.getElementById("rol").textContent =
    usuario.rol;

document.getElementById("fechaInicio").textContent =
    usuario.fechaInicio;

const cotizaciones =
    JSON.parse(localStorage.getItem("cotizaciones")) || [];

const historial =
    cotizaciones.filter(c =>
        c.correoUsuario === usuario.correo
    );

const tabla =
    document.getElementById("tablaCotizaciones");

if(historial.length === 0){

    tabla.innerHTML = `
        <tr>
            <td colspan="5" class="text-center">
                No existen cotizaciones registradas.
            </td>
        </tr>
    `;

}else{

    historial.forEach(cotizacion => {

        tabla.innerHTML += `
            <tr>
                <td>${cotizacion.folio}</td>
                <td>${cotizacion.fecha}</td>
                <td>${cotizacion.producto}</td>
                <td>${cotizacion.cantidad}</td>
                <td>$${Number(cotizacion.total).toLocaleString()}</td>
            </tr>
        `;

    });

}

function cerrarSesion(){

    localStorage.removeItem("usuarioLogueado");

    window.location.href = "login.html";

}

</script>

</body>
</html>
