<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Flores Mobiliario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #6c757d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,.2);
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: #0d6efd;
        }

        .titulo {
            color: #0d6efd;
            font-weight: bold;
        }

        .btn-primary {
            background: #0d6efd;
            border: none;
        }

        .btn-primary:hover {
            background: #0b5ed7;
        }

        .link-registro {
            text-decoration: none;
        }

        .link-registro:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card p-4">

                <div class="text-center mb-4">
                    <div class="logo">Flores Mobiliario</div>
                    <h3 class="titulo">Iniciar Sesión</h3>
                </div>

                <form id="formLogin">

                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input
                            type="email"
                            id="correo"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            required>
                    </div>

                    <div id="mensaje"></div>

                    <div class="d-grid mt-3">
                        <button
                            type="submit"
                            class="btn btn-primary btn-lg">
                            Ingresar
                        </button>
                    </div>

                </form>

                <hr>

                <div class="text-center">
                    ¿No tienes cuenta?
                    <a href="registro.html" class="link-registro">
                        Registrarse
                    </a>
                </div>

            </div>

        </div>

    </div>

</div>

<script>

const formLogin = document.getElementById("formLogin");
const mensaje = document.getElementById("mensaje");

function obtenerUsuarios() {
    return JSON.parse(localStorage.getItem("usuarios")) || [];
}

function guardarSesion(usuario) {

    const sesion = {
        id: usuario.id,
        nombre: usuario.nombre,
        apellidos: usuario.apellidos,
        correo: usuario.correo,
        telefono: usuario.telefono,
        empresa: usuario.empresa,
        rol: usuario.rol,
        fechaInicio: new Date().toLocaleString()
    };

    localStorage.setItem(
        "usuarioLogueado",
        JSON.stringify(sesion)
    );
}

const usuarioActivo = JSON.parse(
    localStorage.getItem("usuarioLogueado")
);

if(usuarioActivo){

    if(usuarioActivo.rol === "admin"){
        window.location.href = "admin.html";
    }else{
        window.location.href = "perfil.html";
    }
}

formLogin.addEventListener("submit", function(e){

    e.preventDefault();

    const correo = document
        .getElementById("correo")
        .value
        .trim()
        .toLowerCase();

    const password = document
        .getElementById("password")
        .value;

    const usuarios = obtenerUsuarios();

    const usuario = usuarios.find(u =>
        u.correo === correo &&
        u.password === password
    );

    if(!usuario){

        mensaje.innerHTML = `
            <div class="alert alert-danger mt-3">
                Correo o contraseña incorrectos.
            </div>
        `;

        return;
    }

    guardarSesion(usuario);

    mensaje.innerHTML = `
        <div class="alert alert-success mt-3">
            Inicio de sesión exitoso.
            Redirigiendo...
        </div>
    `;

    setTimeout(() => {

        if(usuario.rol === "admin"){

            window.location.href = "admin.html";

        }else{

            window.location.href = "perfil.html";

        }

    }, 1500);

});

</script>

</body>
</html>
