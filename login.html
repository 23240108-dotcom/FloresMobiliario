<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/estilos.css"><script src="js/app.js"></script></head><body><script>nav()</script><main class="container my-5" style="max-width:520px"><div class="card shadow p-4"><h2>Iniciar sesión</h2><p class="text-muted">Admin de prueba: admin@flores.com / admin123</p><form id="f"><label class="form-label">Correo</label><input type="email" id="correo" class="form-control mb-3" required><label class="form-label">Contraseña</label><input type="password" id="password" class="form-control mb-3" required><div id="msg"></div><button class="btn btn-primary w-100">Entrar</button></form></div></main><script>f.onsubmit=e=>{e.preventDefault();const mail=correo.value.trim(), pass=password.value; const a=get(DB.administradores).find(x=>x.correo===mail&&x.password===pass); if(a){localStorage.setItem(DB.sesion,JSON.stringify({id:a.id,nombre:a.nombre,correo:a.correo,tipo:'admin'})); location.href='admin.html';return} const c=get(DB.clientes).find(x=>x.correo===mail&&x.password===pass); if(c){localStorage.setItem(DB.sesion,JSON.stringify({id:c.id,nombre:c.nombre,correo:c.correo,tipo:'cliente'})); location.href='perfil.html';return} msg.innerHTML='<div class="alert alert-danger">Correo o contraseña incorrectos.</div>'}</script><script>footer()</script></body></html>
