<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/estilos.css"><script src="js/app.js"></script></head><body><script>nav()</script><main class="container my-5" style="max-width:760px"><div class="card shadow p-4"><h2>Registro de cliente</h2><form id="f" class="row g-3"><div class="col-md-6"><label class="form-label required">Nombre</label><input id="nombre" class="form-control" required></div><div class="col-md-6"><label class="form-label">Teléfono</label><input id="telefono" class="form-control"></div><div class="col-md-6"><label class="form-label required">Correo</label><input type="email" id="correo" class="form-control" required></div><div class="col-md-6"><label class="form-label">Empresa</label><input id="empresa" class="form-control"></div><div class="col-12"><label class="form-label">Dirección</label><input id="direccion" class="form-control"></div><div class="col-md-6"><label class="form-label required">Contraseña</label><input type="password" id="password" class="form-control" required minlength="4"></div><div class="col-md-6"><label class="form-label required">Confirmar contraseña</label><input type="password" id="confirmar" class="form-control" required></div><div id="msg"></div><div><button class="btn btn-primary">Crear cuenta</button></div></form></div></main><script>f.onsubmit=e=>{e.preventDefault();let clientes=get(DB.clientes); if(clientes.some(c=>c.correo===correo.value.trim())){msg.innerHTML='<div class="alert alert-danger">Este correo ya está registrado.</div>';return} if(password.value!==confirmar.value){msg.innerHTML='<div class="alert alert-danger">Las contraseñas no coinciden.</div>';return} const c={id:nextId(DB.clientes),nombre:nombre.value.trim(),telefono:telefono.value.trim(),correo:correo.value.trim(),direccion:direccion.value.trim(),empresa:empresa.value.trim(),password:password.value,fechaRegistro:today()}; clientes.push(c); set(DB.clientes,clientes); localStorage.setItem(DB.sesion,JSON.stringify({id:c.id,nombre:c.nombre,correo:c.correo,tipo:'cliente'})); location.href='perfil.html'};</script><script>footer()</script></body></html>
