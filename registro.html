<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Flores Mobiliario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#0d6efd,#6c757d);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            border:none;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.2);
        }

        .titulo{
            color:#0d6efd;
            font-weight:bold;
        }

        .btn-primary{
            background:#0d6efd;
            border:none;
        }

        .btn-primary:hover{
            background:#0b5ed7;
        }

        .logo{
            font-size:2rem;
            font-weight:bold;
            color:#0d6efd;
        }

        .link-login{
            text-decoration:none;
        }

        .link-login:hover{
            text-decoration:underline;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card p-4">

                <div class="text-center mb-4">
                    <div class="logo">Flores Mobiliario</div>
                    <h3 class="titulo">Registro de Usuario</h3>
                </div>

                <form id="formRegistro">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text"
                                   id="nombre"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Apellidos</label>
                            <input type="text"
                                   id="apellidos"
                                   class="form-control"
                                   required>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email"
                                   id="correo"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="tel"
                                   id="telefono"
                                   class="form-control"
                                   required>
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Empresa</label>
                        <input type="text"
                               id="empresa"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password"
                               id="password"
                               class="form-control"
                               minlength="6"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirmar Contraseña</label>
                        <input type="password"
                               id="confirmarPassword"
                               class="form-control"
                               minlength="6"
                               required>
                    </div>

                    <div id="mensaje" class="mb-3"></div>

                    <div class="d-grid">
                        <button type="submit"
                                class="btn btn-primary btn-lg">
                            Registrarse
                        </button>
                    </div>

                </form>

                <hr>

                <div class="text-center">
                    ¿Ya tienes cuenta?
                    <a href="login.html" class="link-login">
                        Iniciar Sesión
                    </a>
                </div>

            </div>

        </div>

    </div>
</div>

<script>

const formRegistro = document.getElementById("formRegistro");
const mensaje = document.getElementById("mensaje");

function obtenerUsuarios(){
    return JSON.parse(localStorage.getItem("usuarios")) || [];
}

function guardarUsuarios(usuarios){
    localStorage.setItem("usuarios", JSON.stringify(usuarios));
}

formRegistro.addEventListener("submit", function(e){

    e.preventDefault();

    const nombre = document.getElementById("nombre").value.trim();
    const apellidos = document.getElementById("apellidos").value.trim();
    const correo = document.getElementById("correo").value.trim().toLowerCase();
    const telefono = document.getElementById("telefono").value.trim();
    const empresa = document.getElementById("empresa").value.trim();
    const password = document.getElementById("password").value;
    const confirmarPassword = document.getElementById("confirmarPassword").value;

    if(password !== confirmarPassword){

        mensaje.innerHTML = `
            <div class="alert alert-danger">
                Las contraseñas no coinciden.
            </div>
        `;

        return;
    }

    let usuarios = obtenerUsuarios();

    const existe = usuarios.find(
        usuario => usuario.correo === correo
    );

    if(existe){

        mensaje.innerHTML = `
            <div class="alert alert-warning">
                Ya existe un usuario registrado con ese correo.
            </div>
        `;

        return;
    }

    const nuevoUsuario = {

        id: Date.now(),

        nombre: nombre,

        apellidos: apellidos,

        correo: correo,

        password: password,

        telefono: telefono,

        empresa: empresa,

        fechaRegistro: new Date().toLocaleString(),

        rol: "cliente"
    };

    usuarios.push(nuevoUsuario);

    guardarUsuarios(usuarios);

    mensaje.innerHTML = `
        <div class="alert alert-success">
            Usuario registrado correctamente.
            Redirigiendo al login...
        </div>
    `;

    formRegistro.reset();

    setTimeout(() => {
        window.location.href = "login.html";
    }, 2000);

});

if(!localStorage.getItem("usuarios")){

    const adminInicial = [
        {
            id: 1,
            nombre: "Administrador",
            apellidos: "Sistema",
            correo: "admin@floresmobiliario.com",
            password: "admin123",
            telefono: "0000000000",
            empresa: "Flores Mobiliario",
            fechaRegistro: new Date().toLocaleString(),
            rol: "admin"
        }
    ];

    localStorage.setItem(
        "usuarios",
        JSON.stringify(adminInicial)
    );
}

</script>

</body>
</html>
