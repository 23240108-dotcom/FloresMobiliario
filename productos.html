<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Productos</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/estilos.css"><script src="js/app.js"></script></head><body><script>nav('productos')</script><main class="container my-5"><h1>Catálogo de productos</h1><div class="row g-3 mb-4"><div class="col-md-4"><input id="buscar" class="form-control" placeholder="Buscar producto"></div><div class="col-md-3"><select id="cat" class="form-select"><option value="">Todas las categorías</option></select></div></div><div id="lista" class="row g-4"></div></main><script>
const cm=catsMap(); get(DB.categorias).forEach(c=>cat.innerHTML+=`<option value="${c.id}">${c.nombre}</option>`);
function render(){const q=buscar.value.toLowerCase(), c=cat.value; lista.innerHTML=''; get(DB.productos).filter(p=>(!c||p.id_categoria==c)&&p.nombre.toLowerCase().includes(q)).forEach(p=>{lista.innerHTML+=`<div class="col-md-4"><div class="card shadow h-100"><img src="${p.imagen||'logo.png'}" class="card-img-top producto-img"><div class="card-body"><span class="badge ${p.stock>0?'bg-success':'bg-danger'}">Stock: ${p.stock}</span><h5 class="mt-2">${p.nombre}</h5><p class="mb-1"><b>Categoría:</b> ${cm[p.id_categoria]||''}</p><p class="mb-1"><b>Color:</b> ${p.color}</p><p class="mb-1"><b>Medida:</b> ${p.medida}</p><h4 class="text-primary">${money(p.precio)}</h4><button class="btn btn-primary w-100" onclick="cotizar(${p.id})" ${p.stock<=0?'disabled':''}>Agregar a cotización</button></div></div></div>`})}
function cotizar(id){if(!sesion()){alert('Debes iniciar sesión.');location.href='login.html';return} location.href='cotizacion.html?producto='+id} buscar.oninput=render; cat.onchange=render; render();
</script><script>footer()</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
